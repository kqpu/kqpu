<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
<title id="title">M — programação e cibersegurança</title>
<desc id="desc">Banner preto com M em branco e uma ilustração de programador diante de um notebook, terminal e escudo de segurança.</desc>
<defs>
