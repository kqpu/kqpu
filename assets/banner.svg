  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#cbcbcb" stroke-opacity=".035"/></pattern>
  <clipPath id="frame"><rect width="960" height="360" rx="16"/></clipPath>
</defs>
