  <linearGradient id="metal" x2="0" y2="1"><stop stop-color="#242827"/><stop offset="1" stop-color="#0b0d0c"/></linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#a6d7bb" stroke-opacity=".035"/></pattern>
  <clipPath id="frame"><rect width="960" height="360" rx="16"/></clipPath>
</defs>
<g clip-path="url(#frame)">
