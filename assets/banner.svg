<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Código, estilo e possibilidades.</title>
  <desc id="desc">Banner escuro com detalhes em verde e lilás e um símbolo de código.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#101b2d"/>
      <stop offset="1" stop-color="#171329"/>
    </linearGradient>
    <linearGradient id="accent">
      <stop stop-color="#5eead4"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#a5b4fc" opacity=".12"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="958" height="298" rx="24" fill="url(#bg)" stroke="#30344b"/>
  <rect x="1" y="1" width="958" height="298" rx="24" fill="url(#dots)"/>
  <path d="M48 1H912" stroke="url(#accent)" stroke-width="2"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <circle cx="53" cy="52" r="4" fill="#5eead4"/>
    <text x="67" y="57" fill="#a6b4ca" font-size="12" font-weight="600" letter-spacing="3">MEU UNIVERSO EM CÓDIGO</text>
    <text x="48" y="128" fill="#f8fafc" font-size="44" font-weight="700">Código, estilo</text>
    <text x="48" y="181" fill="url(#accent)" font-size="44" font-weight="700">&amp; possibilidades.</text>
    <text x="50" y="235" fill="#b4bfd2" font-size="16">Ideias ganham forma, uma linha de cada vez.</text>
  </g>
  <g transform="translate(702 67)">
    <rect width="204" height="166" rx="18" fill="#0d1424" stroke="#39415b"/>
    <path d="M0 34H204" stroke="#39415b"/>
    <circle cx="19" cy="17" r="4" fill="#fb7185"/>
    <circle cx="34" cy="17" r="4" fill="#fcd34d"/>
    <circle cx="49" cy="17" r="4" fill="#5eead4"/>
    <g fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M64 76L40 100L64 124" stroke="#5eead4"/>
      <path d="M140 76L164 100L140 124" stroke="#c4b5fd"/>
      <path d="M116 66L89 134" stroke="#e2e8f0"/>
    </g>
  </g>
</svg>
